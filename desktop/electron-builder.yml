appId: com.supporthub.app
productName: Support Hub
directories:
  output: release
files:
  - dist/**
  - desktop/main.cjs
  - desktop/preload.cjs
  - desktop/nvx.cjs
  - desktop/terminal.cjs
  - package.json
  # The web app is already bundled into dist/. What the app needs at run time (ssh2 for the terminals) is
  # listed under "dependencies" in package.json and is packed automatically.
npmRebuild: false
win:
  target:
    - portable
    - nsis
portable:
  artifactName: SupportHub-${version}-portable.exe
nsis:
  # Per-user install: no administrator rights needed.
  oneClick: true
  perMachine: false
  artifactName: SupportHub-${version}-setup.exe
