name: Desktop app

# Builds the Windows app and publishes it as a GitHub Release, which is what the app's update check reads.
#
# Three ways to start it:
#   - A merge (or any push) to main: publishes the next patch version automatically, so the installed app
#     offers the update. Merges that only touch Markdown files do not change the app and are skipped; put
#     [skip ci] in a commit message to skip any other one.
#   - Run workflow in the Actions tab: type a version such as 0.2.0 to choose it (a new minor or major), or
#     leave the box empty for the next patch version.
#   - Pushing a tag such as desktop-v0.1.0 publishes that exact version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.2.0. Leave empty for the next patch version.
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'graphify-out/**']
    tags: ['desktop-v*']

permissions:
  contents: write

# Two merges close together must not race for the same version number: the second waits for the first.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          # A tag push names its own version.
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION="${GITHUB_REF_NAME#desktop-v}"; fi
          # A merge to main, or a manual run with the box left empty: one patch number above the latest release.
          if [ -z "$VERSION" ]; then
            LAST=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -z "$LAST" ]; then
              VERSION="0.1.0"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            fi
            echo "Latest release is '${LAST:-none}', so this one is $VERSION."
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must look like 1.2.3, but it is '$VERSION'."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The version only exists in this build; it is not committed.
      - run: npm version "${{ steps.version.outputs.value }}" --no-git-tag-version --allow-same-version
      # A merge that fails lint or the tests is never published, so a broken build cannot reach the installed app.
      - run: npm run lint
      - run: npm test
      - run: npm run desktop:pack

      - name: Check the files an update needs
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ls -la release
          test -f release/latest.yml || { echo "latest.yml is missing: the app could not see this version."; exit 1; }
          test -f "release/SupportHub-$VERSION-setup.exe" || { echo "The installer is missing."; exit 1; }

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "v$VERSION" release/*.exe release/latest.yml \
            --title "Support Hub $VERSION" --generate-notes --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: support-hub-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
